<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RACE MOBIL JUARA</title>
<style>
/* ============ DASAR ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#1b2a49;
  background:linear-gradient(120deg,#ff6b6b,#feca57,#1dd1a1,#48dbfb,#a29bfe,#ff6b6b);background-size:400% 400%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.screen{position:fixed;inset:0;display:none}
.screen.active{display:flex}

/* ============ TOMBOL IKON ============ */
.ibtn{--s:8vh;width:var(--s);height:var(--s);border-radius:50%;border:.5vh solid #1b2a49;font-size:calc(var(--s)*.52);line-height:1;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 .6vh 0 rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s,opacity .2s;background:#fff}
.ibtn:hover{transform:translateY(-.3vh) scale(1.05)}
.ibtn:active{transform:translateY(.4vh);box-shadow:0 .1vh 0 rgba(0,0,0,.3)}
.ibtn.green{background:#2ecc71}.ibtn.red{background:#ff5252}.ibtn.blue{background:#4dabf7}
.ibtn.yellow{background:#ffd43b}.ibtn.purple{background:#b197fc}.ibtn.gray{background:#ced4da}
.ibtn.xl{--s:16vh}.ibtn.md{--s:11vh}.ibtn.sm{--s:7vh}
.ibtn.dim{opacity:.35;pointer-events:none}
.ibtn.off{opacity:.55}
.ibtn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ============ HALAMAN PEMBUKA ============ */
#intro{flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;text-align:center;padding:2vh}
.brand{background:#fff;border:.5vh solid #1b2a49;border-radius:5vh;padding:.8vh 3vh;font-weight:900;font-size:2.8vh;letter-spacing:.3vh;box-shadow:0 .6vh 0 rgba(0,0,0,.25)}
.big{font-size:clamp(30px,10vh,110px);line-height:1.02;color:#fff;font-weight:900;
  text-shadow:-.5vh -.5vh 0 #1b2a49,.5vh -.5vh 0 #1b2a49,-.5vh .5vh 0 #1b2a49,.5vh .5vh 0 #1b2a49,0 1.2vh 0 #1b2a49;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1vh)}}
.sub{background:#1b2a49;color:#fff;border-radius:3vh;padding:1vh 3vh;font-size:3.2vh;font-weight:800}
.infoBtn{position:absolute;right:2vh;top:2vh}
.fullBtn{position:absolute;left:2vh;top:2vh}
#credit{position:absolute;right:2vh;top:10.5vh;background:#fff;border:.4vh solid #1b2a49;border-radius:2vh;padding:1.2vh 2vh;font-size:2.6vh;font-weight:800;
  opacity:0;transform:translateY(-1vh) scale(.9);pointer-events:none;transition:.25s;box-shadow:0 .6vh 0 rgba(0,0,0,.25)}
#credit.show{opacity:1;transform:none}
.drive{position:absolute;left:0;right:0;bottom:0;height:17vh;background:#555;border-top:1.2vh solid;border-image:repeating-linear-gradient(90deg,#e53935 0 3vh,#fff 3vh 6vh) 1;overflow:hidden;pointer-events:none}
.drive::after{content:"";position:absolute;left:0;right:0;top:50%;height:.6vh;background:repeating-linear-gradient(90deg,#fff 0 6vh,transparent 6vh 12vh);opacity:.8}
.drive .dc{position:absolute;bottom:2.5vh;width:20vh;left:-25vh;animation:drive linear infinite}
@keyframes drive{from{left:-25vh}to{left:110vw}}

/* ============ PILIH MAPEL & SOAL ============ */
#pilih{align-items:center;justify-content:center}
.pwrap{width:min(96vw,155vh);display:flex;flex-direction:column;gap:2vh;align-items:center;background:rgba(255,255,255,.94);border:.6vh solid #1b2a49;border-radius:3vh;padding:2.4vh 2.2vw;box-shadow:0 1vh 0 rgba(0,0,0,.25)}
.ptitle{font-size:4.2vh;font-weight:900;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.8vh 1.2vw;width:100%}
.mcard{--c:#4dabf7;height:17vh;border:.5vh solid var(--c);border-radius:2.2vh;background:#fff;padding:1.2vh .5vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh;
  cursor:pointer;font-family:inherit;color:#1b2a49;box-shadow:0 .6vh 0 rgba(0,0,0,.22);transition:transform .15s,background .15s}
.mcard:hover{transform:translateY(-.3vh)}
.mcard .mi{font-size:6.4vh;line-height:1}
.mcard .mn{font-size:2.2vh;font-weight:900;line-height:1.1;text-align:center}
.mcard .mc{font-size:1.8vh;font-weight:700;opacity:.7}
.mcard.sel{background:#ffd43b;border-color:#1b2a49;transform:translateY(-.6vh) scale(1.05);box-shadow:0 1vh 0 rgba(0,0,0,.3)}
.lvrow{display:flex;align-items:center;gap:2vw;flex-wrap:wrap;justify-content:center}
.lvlab{font-size:2.8vh;font-weight:900}
.lvl{display:flex;gap:1.4vh}
.lv{border:.5vh solid #1b2a49;background:#fff;border-radius:2.2vh;padding:.8vh 2.2vh;font-size:3.8vh;cursor:pointer;box-shadow:0 .6vh 0 rgba(0,0,0,.25);transition:.15s;line-height:1.2}
.lv.active{background:#74c0fc;transform:scale(1.1)}
.jml{background:#1b2a49;color:#fff;border-radius:3vh;padding:.8vh 2.4vh;font-size:3vh;font-weight:900}
.pill{background:#1b2a49;color:#fff;border-radius:3vh;padding:.8vh 2.4vh;font-size:2.8vh;font-weight:800;text-align:center}

/* ============ PENGATURAN PEMAIN ============ */
#setup{align-items:center;justify-content:center}
.card{background:rgba(255,255,255,.95);border:.6vh solid #1b2a49;border-radius:3vh;padding:3vh 4vh;width:min(94vw,135vh);box-shadow:0 1vh 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:2vh;align-items:center}
.card h2{font-size:4.2vh;font-weight:900}
.cnts{display:flex;gap:2vh}
.cnt{border:.5vh solid #1b2a49;background:#fff;border-radius:2.5vh;padding:1.2vh 2.5vh;font-size:4vh;cursor:pointer;box-shadow:0 .6vh 0 rgba(0,0,0,.25);transition:.15s}
.cnt.active{background:#ffd43b;transform:scale(1.1)}
#names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2vh 2.4vh;width:100%}
.nrow{display:flex;align-items:center;gap:1.4vh;background:#fff;border-radius:2.2vh;padding:1.2vh 1.6vh;border:.5vh solid;min-width:0;box-shadow:0 .5vh 0 rgba(0,0,0,.15)}
.nrow svg{width:11vh;flex:none;overflow:visible}
.nrow input{flex:1;min-width:0;width:100%;font-size:3.2vh;font-weight:800;border:.3vh solid #adb5bd;border-radius:1.4vh;padding:1vh 1.2vh;font-family:inherit;-webkit-user-select:text;user-select:text;color:#1b2a49}
.nrow input:focus{outline:none;border-color:#4dabf7}
.row{display:flex;gap:4vh}

/* ============ LAYAR PERMAINAN ============ */
#game{flex-direction:column;padding:1vh 1vw;gap:.8vh}
.top{display:flex;gap:1vw;height:15vh;flex:none}
.qcard{flex:1;min-width:0;background:#fff;border:.5vh solid #1b2a49;border-radius:2vh;padding:.8vh 1.4vw;display:flex;flex-direction:column;justify-content:center;gap:.7vh;box-shadow:0 .6vh 0 rgba(0,0,0,.25)}
.qrow{display:flex;align-items:center;gap:1.2vw}
.qm{flex:none;font-size:4.8vh;line-height:1}
.qn{flex:none;width:7vh;height:7vh;border-radius:50%;background:#ff6b6b;color:#fff;font-size:4vh;font-weight:900;display:grid;place-items:center;border:.4vh solid #1b2a49}
.qtext{font-size:clamp(16px,3.3vh,38px);font-weight:800;line-height:1.15}
.timer{height:1.4vh;background:#e9ecef;border-radius:1vh;overflow:hidden;flex:none}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#1dd1a1,#feca57);border-radius:1vh;transition:width .1s linear}
.timer i.low{background:linear-gradient(90deg,#ff5252,#ff922b)}
.reveal{display:none;background:#d3f9d8;border:.3vh solid #2ecc71;border-radius:1.2vh;padding:.3vh 1.2vh;font-size:2.4vh;font-weight:900;color:#1b6b34}
.reveal.show{display:block}
.ctrls{display:grid;grid-template-columns:repeat(2,auto);grid-template-rows:repeat(2,auto);gap:1vh .8vw;align-content:center}
.ctrls .ibtn{--s:6.4vh}
.rankbar{display:flex;gap:.8vw;height:5vh;flex:none}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:.6vw;padding:0 1vw;border-radius:2.5vh;border:.35vh solid #1b2a49;font-size:2.4vh;font-weight:900;box-shadow:0 .4vh 0 rgba(0,0,0,.25);animation:chipin .3s}
.chip span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes chipin{from{transform:scale(.9);opacity:.5}to{transform:none;opacity:1}}
.race{flex:1;min-height:0;display:flex;flex-direction:column;border:.5vh solid #1b2a49;border-radius:1.8vh;overflow:hidden;background:#333;box-shadow:0 .6vh 0 rgba(0,0,0,.25)}
.stands{flex:none;height:6.6vh;position:relative;overflow:hidden;background:linear-gradient(#4b3f8f,#8e6fc4);display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;padding-top:1.2vh;line-height:1}
.stands::before{content:"";position:absolute;left:0;right:0;top:0;height:1vh;background:repeating-linear-gradient(90deg,#ff5252 0 3vh,#ffd43b 3vh 6vh,#4dabf7 6vh 9vh,#2ecc71 9vh 12vh)}
.stands span{font-size:2.5vh;display:inline-block;animation:cheer .9s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7vh)}}
.road{flex:1;min-height:0;display:flex;flex-direction:column;background:#555}
.curb{flex:none;height:1.1vh;background:repeating-linear-gradient(90deg,#e53935 0 2.2vh,#fff 2.2vh 4.4vh)}
.lane{flex:1;min-height:0;display:grid;grid-template-columns:17vw 1fr;border-top:.3vh dashed rgba(255,255,255,.6)}
.lane:nth-child(2){border-top:none}
.lbl{display:flex;align-items:center;gap:.6vw;padding:0 .8vw;border-right:.4vh solid #1b2a49;min-width:0}
.medal{font-size:3.6vh;flex:none;width:4.2vh;text-align:center}
.li{flex:1;min-width:0;display:flex;flex-direction:column;gap:.4vh}
.l1{display:flex;align-items:center;gap:.5vw;font-weight:900;font-size:2.3vh}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{flex:none;font-size:2.1vh;background:rgba(0,0,0,.3);border-radius:2vh;padding:0 .6vw}
.pb{position:relative;height:1.9vh;background:rgba(0,0,0,.35);border-radius:1vh;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff59d,#fff);border-radius:1vh;transition:width 1.4s cubic-bezier(.2,.8,.25,1)}
.pb em{position:absolute;inset:0;text-align:center;font-style:normal;font-size:1.45vh;line-height:1.9vh;color:#fff;font-weight:900;text-shadow:0 0 .4vh #000,0 0 .4vh #000}
.run{position:relative;background:linear-gradient(#6b6b6b,#4f4f4f)}
.run::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.7vh;background:#fff;z-index:1}
.lc{position:absolute;left:.7vh;right:1.8vh;top:0;bottom:0}
.fin{position:absolute;right:0;top:0;bottom:0;width:1.8vh;background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/.9vh .9vh}
.car{position:absolute;left:0;bottom:6%;height:min(86%,13vh);aspect-ratio:2/1;transition:left 1.4s cubic-bezier(.2,.8,.25,1),transform 1.4s cubic-bezier(.2,.8,.25,1);z-index:2}
.cb{position:relative;width:100%;height:100%}
.cb svg{width:100%;height:100%;display:block;overflow:visible}
.spd{opacity:0;transition:opacity .2s}
.cb.boost .spd{opacity:1}
.cb.boost svg{filter:drop-shadow(-1.8vh 0 1.1vh rgba(255,255,255,.45))}
.cb .wh{transform-box:fill-box;transform-origin:center}
.cb.go .wh{animation:spin .22s linear infinite}
.cb.go{animation:bump .2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bump{0%,100%{transform:translateY(0)}50%{transform:translateY(-.35vh)}}
.cb.cough{animation:cough .5s ease-in-out 3}
@keyframes cough{0%,100%{transform:translate(0,0) rotate(0)}15%{transform:translate(-.4vh,-.8vh) rotate(-3deg)}30%{transform:translate(.3vh,0) rotate(1deg)}45%{transform:translate(-.4vh,-.8vh) rotate(-3deg)}60%{transform:translate(.3vh,0)}75%{transform:translate(-.3vh,-.4vh) rotate(-2deg)}}
.puff{position:absolute;width:2.4vh;height:2.4vh;border-radius:50%;background:rgba(255,255,255,.9);animation:puff .9s ease-out forwards;pointer-events:none;z-index:1}
.puff.dark{background:rgba(55,55,55,.85)}
@keyframes puff{from{transform:scale(.4);opacity:.95}to{transform:translate(-4vh,-3vh) scale(2.2);opacity:0}}
.pop{position:absolute;left:25%;top:-12%;font-size:2.8vh;font-weight:900;color:#fff;white-space:nowrap;text-shadow:-.2vh -.2vh 0 #1b2a49,.2vh -.2vh 0 #1b2a49,-.2vh .2vh 0 #1b2a49,.2vh .2vh 0 #1b2a49;animation:pop 1.3s ease-out forwards;pointer-events:none;z-index:5}
@keyframes pop{0%{transform:translateY(0) scale(.5);opacity:0}20%{transform:translateY(-.8vh) scale(1.15);opacity:1}100%{transform:translateY(-4vh) scale(1);opacity:0}}

/* ---- kolom jawaban ---- */
.answers{flex:none;height:33vh;display:flex;gap:.8vw}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6vh;padding:.6vh;border:.55vh solid;border-radius:1.8vh;background:rgba(255,255,255,.88);box-shadow:0 .5vh 0 rgba(0,0,0,.25)}
.chd{flex:none;height:4.2vh;border-radius:1.2vh;display:flex;align-items:center;justify-content:center;font-size:2.4vh;font-weight:900;overflow:hidden;padding:0 .6vw}
.chd .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opts{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,1fr);gap:.6vh}
.opt{position:relative;display:flex;align-items:center;gap:.6vw;min-height:0;text-align:left;font-family:inherit;font-size:clamp(12px,2.15vh,24px);font-weight:700;line-height:1.1;
  padding:0 .7vw;background:#fff;color:#1b2a49;border:.35vh solid #1b2a49;border-radius:1.3vh;cursor:pointer;transition:transform .1s,background .15s}
.opt:active{transform:scale(.97)}
.opt b{flex:none;width:3.4vh;height:3.4vh;border-radius:50%;background:#1b2a49;color:#fff;display:grid;place-items:center;font-size:2vh}
.opt span{flex:1;min-width:0}
.opt.picked{background:#fff3b0;border-color:#f59f00;transform:scale(.98)}
.col.lock .opt{pointer-events:none}
.col.lock:not(.reveal) .opt:not(.picked){opacity:.5}
.opt.correct{background:#2ecc71;color:#fff;border-color:#1b6b34}
.opt.correct::after{content:"✔";font-size:3vh;font-weight:900}
.opt.wrong{background:#e74c3c;color:#fff;border-color:#8b1a10}
.opt.wrong::after{content:"✖";font-size:3vh;font-weight:900}
.opt.correct b,.opt.wrong b{background:#fff;color:#1b2a49}

/* ============ OVERLAY ============ */
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:36vh;font-weight:900;color:#fff;z-index:45;background:rgba(0,0,0,.35);
  text-shadow:-.8vh -.8vh 0 #1b2a49,.8vh -.8vh 0 #1b2a49,-.8vh .8vh 0 #1b2a49,.8vh .8vh 0 #1b2a49,0 1.6vh 0 #1b2a49}
#cd.show{display:flex}
#cd.pop2{animation:cdpop .7s ease-out}
@keyframes cdpop{0%{transform:scale(2);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:1}}
#flag{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;z-index:40;background:rgba(0,0,0,.4)}
#flag.show{display:flex}
.fn{font-size:6vh;font-weight:900;color:#fff;text-shadow:-.4vh -.4vh 0 #1b2a49,.4vh -.4vh 0 #1b2a49,-.4vh .4vh 0 #1b2a49,.4vh .4vh 0 #1b2a49;margin-top:-1vh}
.donebox{flex:1;grid-row:1/5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9vh;gap:1vh;background:#e7f5ff;border-radius:1.3vh}
.fw{display:flex;align-items:flex-start}
.pole{width:1.4vh;height:44vh;background:linear-gradient(90deg,#adb5bd,#f1f3f5,#adb5bd);border-radius:1vh;border:.3vh solid #1b2a49}
.cloth{width:60vh;height:30vh;background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/7.5vh 7.5vh;border:.6vh solid #1b2a49;transform-origin:left center;animation:wave .55s ease-in-out infinite alternate;box-shadow:0 1vh 2vh rgba(0,0,0,.4)}
@keyframes wave{from{transform:perspective(70vh) rotateY(-22deg) skewY(-5deg)}to{transform:perspective(70vh) rotateY(22deg) skewY(5deg)}}
.ft{font-size:12vh;font-weight:900;color:#ffd43b;letter-spacing:.8vh;text-shadow:-.6vh -.6vh 0 #1b2a49,.6vh -.6vh 0 #1b2a49,-.6vh .6vh 0 #1b2a49,.6vh .6vh 0 #1b2a49,0 1.2vh 0 #1b2a49;animation:bob 1s ease-in-out infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ============ HALAMAN AKHIR ============ */
#end{flex-direction:column;align-items:center;padding:2.5vh 3vw;gap:1.5vh}
.win{font-size:6.2vh;font-weight:900;color:#fff;text-align:center;text-shadow:-.4vh -.4vh 0 #1b2a49,.4vh -.4vh 0 #1b2a49,-.4vh .4vh 0 #1b2a49,.4vh .4vh 0 #1b2a49,0 1vh 0 #1b2a49;animation:bob 1.6s ease-in-out infinite}
.pod{flex:1;min-height:0;width:100%;max-width:140vh;display:flex;align-items:flex-end;justify-content:center;gap:1.6vw}
.pi{flex:1;max-width:32vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pi .pcar{width:100%;max-width:24vh;animation:bob 1.4s ease-in-out infinite}
.pi .pcar svg{width:100%;display:block;overflow:visible}
.pi .pn{font-size:3.2vh;font-weight:900;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:-.25vh -.25vh 0 #1b2a49,.25vh -.25vh 0 #1b2a49,-.25vh .25vh 0 #1b2a49,.25vh .25vh 0 #1b2a49;margin:.4vh 0}
.pi .bar{width:100%;border:.5vh solid #1b2a49;border-bottom:none;border-radius:2vh 2vh 0 0;display:flex;flex-direction:column;align-items:center;gap:.6vh;padding-top:1.2vh;font-size:3.2vh;font-weight:900;background:linear-gradient(#fff9db,#ffd43b);transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.9,.3,1.2) backwards}
.pi .bar .m{font-size:7vh;line-height:1}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.endbtns{display:flex;gap:4vh;flex:none}
</style>
</head>
<body>

<!-- ============ 1. HALAMAN PEMBUKA ============ -->
<div id="intro" class="screen active">
  <div class="brand" id="tBrand">RACE MOBIL JUARA</div>
  <h1 class="big" id="tJudul">BATTLE RACE<br>MOBIL 4 PEMAIN</h1>
  <div class="sub" id="tSub">Kuis Seru Kelas IV</div>
  <button class="ibtn green xl pulse" id="bStart" title="Mulai Permainan" aria-label="Mulai Permainan">▶️</button>
  <button class="ibtn yellow sm fullBtn" id="bFull" title="Layar Penuh" aria-label="Layar Penuh">🖥️</button>
  <button class="ibtn blue sm infoBtn" id="bInfo" title="Info Pengembang" aria-label="Info Pengembang">ℹ️</button>
  <div id="credit">Pengembang : Jasrin R. Nupura, S.Pd</div>
  <div class="drive" id="drive"></div>
</div>

<!-- ============ 1b. PILIH MAPEL & SOAL ============ -->
<div id="pilih" class="screen">
  <div class="pwrap">
    <h2 class="ptitle">📚 Pilih Mata Pelajaran dan Soal</h2>
    <div class="mgrid" id="mgrid"></div>
    <div class="lvrow">
      <span class="lvlab">Tingkat soal:</span>
      <div class="lvl" id="lvls">
        <button class="lv" data-l="1" title="Mudah" aria-label="Mudah">⭐</button>
        <button class="lv" data-l="2" title="Sedang" aria-label="Sedang">⭐⭐</button>
        <button class="lv" data-l="3" title="Sulit" aria-label="Sulit">⭐⭐⭐</button>
        <button class="lv active" data-l="0" title="Semua tingkat" aria-label="Semua tingkat">🌈</button>
      </div>
      <div class="jml" id="jml"></div>
    </div>
    <div class="row">
      <button class="ibtn red md" id="bPBack" title="Kembali" aria-label="Kembali">⬅️</button>
      <button class="ibtn green md dim" id="bPNext" title="Lanjut" aria-label="Lanjut">▶️</button>
    </div>
  </div>
</div>

<!-- ============ 2. PENGATURAN PEMAIN ============ -->
<div id="setup" class="screen">

/* =====================================================================
   EFEK SUARA  (Web Audio API — tanpa file audio)
   ===================================================================== */
let actx = null, muted = false;
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
  if(actx && actx.state==='suspended') actx.resume();
  return actx;
}
function tone(f, d, type, vol, t, f2){
  const a = ac(); if(!a || muted) return;
  const o=a.createOscillator(), g=a.createGain(), t0=a.currentTime+(t||0);
  o.type = type||'sine';
  o.frequency.setValueAtTime(f, t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0+d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||.15, t0+.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+.05);
}
const sfx = {
  pilih(){ tone(700,.06,'square',.07); },
  benar(){ [523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.2,i*.09)); },
  salah(){ tone(220,.35,'sawtooth',.15,0,80); tone(160,.3,'square',.09,.12,60); },
  skor(){ tone(988,.08,'square',.09); tone(1319,.3,'square',.09,.09); },
  vroom(){ tone(90,.7,'sawtooth',.06,0,260); },
  tick(go){ tone(go?1046:660, go?.45:.12, 'square', .12); },
  mulai(){ tone(440,.08,'triangle',.12); tone(660,.1,'triangle',.12,.08); },
  reset(){ tone(500,.18,'sine',.12,0,250); },
  meriah(){
    [523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.24,'triangle',.2,i*.16));
    [262,330,392].forEach(f=>tone(f,1,'sine',.12,1.3));
  }
};

/* =====================================================================
   EFEK VISUAL: CONFETTI & KEMBANG API (canvas)
   ===================================================================== */
const cv = $('fx'), cx = cv.getContext('2d');
let parts = [], raf = 0;
function resizeFx(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resizeFx); resizeFx();
function loopFx(){ if(!raf) raf = requestAnimationFrame(stepFx); }
function stepFx(){
  raf = 0; cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{
    p.life--; if(p.life<=0) return;
    p.vy += p.g; p.x += p.vx; p.y += p.vy;
    if(p.type==='c'){
      p.rot += p.vr; p.vx *= .99;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.col; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    }else{
      p.vx *= .98; cx.globalAlpha = Math.max(0,p.life/p.max); cx.fillStyle=p.col;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill(); cx.globalAlpha = 1;
    }
  });
  parts = parts.filter(p=>p.life>0);
  if(parts.length) loopFx();
}
function confetti(x, y, n){
  const cols=['#ff5252','#ffd43b','#4dabf7','#2ecc71','#b197fc','#ff922b','#fff'];
  for(let i=0;i<(n||60);i++) parts.push({type:'c',x,y,vx:(Math.random()-.5)*12,vy:-Math.random()*11-2,g:.28,w:6+Math.random()*7,h:4+Math.random()*6,
    rot:Math.random()*6,vr:(Math.random()-.5)*.4,col:cols[Math.floor(Math.random()*cols.length)],life:80+Math.random()*50});
  loopFx();
}
function firework(x, y){
  const hue = Math.floor(Math.random()*360);
  for(let i=0;i<80;i++){
    const a=Math.random()*6.283, s=1+Math.random()*6;
    parts.push({type:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.07,r:2+Math.random()*2.5,col:`hsl(${hue+Math.random()*40},100%,60%)`,life:70,max:70});
  }
  loopFx();
}

      `<div class="run"><div class="lc"><div class="car"><div class="cb">${carSVG(p.w,i+1)}</div></div></div><div class="fin"></div></div>`);
    const lbl = lane.querySelector('.lbl');

    lane.querySelector('.nm').textContent = p.name;

    p.bar = lane.querySelector('.pb i');    p.pct = lane.querySelector('.pb em');

    ans.appendChild(col);
  });
  road.appendChild(el('div','curb'));
  S.players.forEach(p=>setCar(p,0));
  updateBoard();
}
function setCar(p, frac){
  p.car.style.left = (frac*100)+'%';
  p.car.style.transform = 'translateX('+(-frac*100)+'%)';
}
function peringkat(){
  return S.players.map((p,i)=>({p,i})).sort((a,b)=>{ if(a.p.done&&b.p.done) return a.p.order-b.p.order; if(a.p.done!==b.p.done) return a.p.done?-1:1; return b.p.dist-a.p.dist || b.p.score-a.p.score || a.i-b.i; }).map(x=>x.p);
}
function updateBoard(){
  const r = peringkat(), moved = S.players.some(p=>p.dist>0 || p.done);
  r.forEach((p,k)=>{ p.rank = k; });
  S.players.forEach(p=>{
    const pct = Math.min(100, Math.round(p.dist/PENGATURAN.garisFinis*100));
    p.bar.style.width = pct+'%'; p.pct.textContent = pct+'%';
    p.scEl.textContent = '⭐ '+p.score;
    p.medal.textContent = moved ? MEDALI[p.rank] : '🏁';
  });
  const rb = $('rankbar'); rb.innerHTML='';
  r.forEach(p=>{
    const chip = el('div','chip','<span>'+(moved?MEDALI[p.rank]:'🚗')+'</span><span class="n"></span><span>⭐'+p.score+'</span>');
    chip.querySelector('.n').textContent = p.name;
    chip.style.background = p.w.c; chip.style.color = p.w.t;
    rb.appendChild(chip);
  });
}

   ===================================================================== */
function mulaiBabak(){
  clearLater(); stopTimer(); hideOverlays();
  S.players.forEach(p=>{ p.dist=0; p.score=0; p.answer=null; p.time=null; p.done=false; p.order=0; });
  S.finN = 0;
  S.qOrder = acak(bankSoal.map((_,i)=>i)); S.qPtr = 0; S.qNo = 0; S.q = null;
  buildGame();
  $('qno').textContent = '0'; $('qm').textContent = ''; $('qtext').textContent = '🚦'; $('reveal').classList.remove('show'); $('timer').style.display='';
  $('tbar').style.width = '100%';
  showScreen('game');
  countdown();
}
function countdown(){
  setPhase('countdown');
  const cd = $('cd'); cd.classList.add('show');
  ['3','2','1','🏁'].forEach((t,i)=>{
    later(()=>{ cd.textContent=t; cd.classList.remove('pop2'); void cd.offsetWidth; cd.classList.add('pop2'); sfx.tick(i===3); }, i*800);
  });
  later(()=>{ cd.classList.remove('show'); setPhase('idle'); nextQuestion(); }, 3500);
}
function aktif(){ return S.players.filter(p=>!p.done); }
function ambilSoal(){
  if(S.qPtr >= S.qOrder.length){ S.qOrder = acak(bankSoal.map((_,i)=>i)); S.qPtr = 0; }
  return bankSoal[S.qOrder[S.qPtr++]];
}
function nextQuestion(){
  if(S.phase!=='idle' && S.phase!=='question') return;
  stopTimer();
  if(S.autoT){ clearTimeout(S.autoT); timers.delete(S.autoT); S.autoT = 0; }
  S.q = ambilSoal(); S.qNo++;
  $('qno').textContent = S.qNo; $('qtext').textContent = S.q.tanya; $('qm').textContent = ikonMapel(S.q.mapel); $('qm').title = namaMapel(S.q.mapel);
  $('reveal').classList.remove('show'); $('timer').style.display='';
  const shown = acak(S.q.opsi.map((t,i)=>({t,i})));
  const huruf = ['A','B','C','D'];
  S.players.forEach((p,pi)=>{
    p.answer = null; p.time = null;
    p.col.classList.remove('lock','reveal');
    p.cb.classList.remove('go','boost','cough');
    p.opts.innerHTML = '';
    if(p.done){
      p.col.classList.add('lock','reveal');
      p.opts.innerHTML = '<div class="donebox"><div>'+MEDALI[p.rank]+'</div><div>🏁</div></div>';
      return;
    }
    shown.forEach((o,k)=>{
      const b = el('button','opt','<b>'+huruf[k]+'</b><span></span>');
      b.querySelector('span').textContent = o.t;
      b.dataset.idx = o.i;
      b.addEventListener('pointerdown', e=>{ e.preventDefault(); jawab(pi, o.i, b); });
      p.opts.appendChild(b);
    });
  });
  S.qStart = performance.now();
  S.deadline = S.qStart + PENGATURAN.waktuSoal*1000;
  setPhase('question');
  S.tid = setInterval(()=>{
    const left = S.deadline - performance.now();
    const f = Math.max(0, left/(PENGATURAN.waktuSoal*1000));
    $('tbar').style.width = (f*100)+'%';
    $('tbar').classList.toggle('low', f<.3);
    if(left<=0){ stopTimer(); resolve(); }
  }, 100);
  sfx.mulai();
}

function jawab(pi, idx, btn){
  if(S.phase!=='question') return;
  const p = S.players[pi]; if(p.answer!==null) return;
  p.answer = idx; p.time = performance.now()-S.qStart;
  p.col.classList.add('lock'); btn.classList.add('picked'); sfx.pilih();
  const lim = performance.now() + PENGATURAN.waktuSetelahPertama*1000;
  if(S.deadline > lim) S.deadline = lim;           // pemain pertama menjawab → sisa waktu dipercepat
  if(aktif().every(x=>x.answer!==null)){
    stopTimer();
    const no = S.qNo;
    later(()=>{ if(S.qNo===no) resolve(); }, 400);
  }
}

function resolve(){
  if(S.phase!=='question') return;
  setPhase('resolving'); stopTimer();
  const q = S.q, P = PENGATURAN;
  const benar = aktif().filter(p=>p.answer===q.benar).sort((a,b)=>a.time-b.time);
  const salah = S.players.filter(p=>p.answer!==null && p.answer!==q.benar);

  /* tampilkan kunci jawaban */
  S.players.forEach(p=>{
    p.col.classList.add('lock','reveal');
    Array.from(p.opts.children).forEach(b=>{
      const k = +b.dataset.idx; b.classList.remove('picked');
      if(k===q.benar) b.classList.add('correct'); else if(k===p.answer) b.classList.add('wrong');
    });
  });
  $('timer').style.display = 'none';
  $('reveal').textContent = '✅ ' + q.opsi[q.benar]; $('reveal').classList.add('show');

  if(benar.length) sfx.benar();
  if(salah.length) later(()=>sfx.salah(), benar.length?500:0);

  /* jawaban benar: tercepat maju paling jauh */
  benar.forEach((p,i)=>{
    later(()=>{
      const g  = P.jarakMaju[Math.min(i,P.jarakMaju.length-1)];
      const pt = P.poin[Math.min(i,P.poin.length-1)];
      p.dist += g; p.score += pt;
      setCar(p, Math.min(1, p.dist/P.garisFinis));
      updateBoard();
      animasiMaju(p, i===0, '+'+pt+' ⭐');
      sfx.skor(); sfx.vroom();
      const r = p.col.getBoundingClientRect();
      confetti(r.left+r.width/2, r.top+r.height*.3, i===0?70:35);
    }, 200+i*350);
  });
  /* jawaban salah: mobil tertahan & batuk */
  salah.forEach(p=>animasiBatuk(p));

  later(selesaiBabak, 200 + benar.length*350 + 1700);
}

function selesaiBabak(){
  updateBoard();
  /* pemain yang baru menyentuh garis finis pada soal ini */
  const baru = aktif().filter(p=>p.dist >= PENGATURAN.garisFinis)
    .sort((a,b)=>b.dist-a.dist || b.score-a.score);
  baru.forEach(p=>{ p.done = true; p.order = ++S.finN; });
  if(baru.length){
    updateBoard();
    if(aktif().length===0){ finish(); return; }      // semua pemain sudah finis → permainan selesai
    miniFinish(baru);                                // masih ada pemain lain → permainan lanjut
    return;
  }
  setPhase('idle');
  S.autoT = later(nextQuestion, 3200);
}
/* perayaan singkat untuk pemain yang finis, permainan tetap berlanjut */
function miniFinish(baru){
  $('fname').textContent = baru.map(p=>MEDALI[p.order-1]+' '+p.name).join('  ');
  $('flag').classList.add('show'); sfx.meriah();
  const fin = S.players[0].lane.querySelector('.fin').getBoundingClientRect();
  const rc = $('road').getBoundingClientRect();
  for(let k=0;k<4;k++) later(()=>firework(fin.left - Math.random()*innerWidth*.3, rc.top + Math.random()*rc.height), k*400);
  later(()=>{
    $('flag').classList.remove('show'); $('fname').textContent='';
    setPhase('idle');
    S.autoT = later(nextQuestion, 1500);
  }, 3000);
}

/* ---------- animasi mobil ---------- */
function puffs(p, kind, dur){
  const id = setInterval(()=>{
    const r = p.car.getBoundingClientRect(), pr = p.lc.getBoundingClientRect();
    const s = el('span','puff '+kind);
    s.style.left = (r.left-pr.left + r.width*.04)+'px';
    s.style.top  = (r.top-pr.top + r.height*.7)+'px';
    p.lc.appendChild(s); setTimeout(()=>s.remove(), 950);
  }, 90);
  timers.add(id);
  setTimeout(()=>{ clearInterval(id); timers.delete(id); }, dur);
}
function pop(p, txt){
  const s = el('div','pop'); s.textContent = txt; p.car.appendChild(s);
  setTimeout(()=>s.remove(), 1400);
}
function animasiMaju(p, cepat, label){
  p.cb.classList.add('go'); if(cepat) p.cb.classList.add('boost');
  puffs(p, '', 1500); pop(p, (cepat?'⚡ ':'')+label);
  later(()=>p.cb.classList.remove('go','boost'), 1500);
}
function animasiBatuk(p){
  p.cb.classList.add('cough'); puffs(p, 'dark', 1500); pop(p, '💥 uhuk!');
  later(()=>p.cb.classList.remove('cough'), 1550);
}

/* ---------- pemenang ---------- */
function finish(){
  setPhase('finished'); stopTimer();
  $('fname').textContent = '🏆 '+peringkat()[0].name;
  $('flag').classList.add('show'); sfx.meriah();
  const fin = S.players[0].lane.querySelector('.fin').getBoundingClientRect();
  const rc = $('road').getBoundingClientRect();
  for(let k=0;k<8;k++){
    later(()=>{
      firework(fin.left - Math.random()*innerWidth*.35, rc.top + Math.random()*rc.height);
      firework(Math.random()*innerWidth, Math.random()*innerHeight*.5);
    }, k*420);
  }
  later(()=>{ $('flag').classList.remove('show'); $('fname').textContent=''; tampilAkhir(); }, 3800);
}
function tampilAkhir(){
  const r = peringkat();
  $('winTitle').textContent = '🏆 ' + r[0].name + ' Juara!';
  const pod = $('pod'); pod.innerHTML = '';
  const tinggi = [100,78,62,48];
  const urutan = [1,0,2,3].filter(k=>k<r.length);       // 2 - 1 - 3 - 4
  urutan.forEach(k=>{
    const p = r[k];
    const it = el('div','pi','<div class="pcar">'+carSVG(p.w, S.players.indexOf(p)+1)+'</div><div class="pn"></div><div class="bar"><div class="m">'+MEDALI[k]+'</div><div>⭐ '+p.score+'</div></div>');
    it.querySelector('.pn').textContent = p.name;
    const bar = it.querySelector('.bar'); bar.style.height = (tinggi[k]*.62)+'%';
    bar.style.animationDelay = ((r.length-1-k)*.25)+'s';
    pod.appendChild(it);
  });
  showScreen('end');
  for(let k=0;k<6;k++){
    later(()=>{ confetti(Math.random()*innerWidth, innerHeight*.2, 60); firework(Math.random()*innerWidth, innerHeight*(.15+Math.random()*.3)); }, 200+k*600);
  }
}

/* =====================================================================
   KONTROL GURU
   ===================================================================== */
$('bLintasan').onclick = ()=>{               // Reset Lintasan: mobil kembali ke garis start
  if(S.phase==='countdown' || S.phase==='finished' || S.phase==='menu') return;
  if(S.phase==='resolving'){ clearLater(); setPhase('idle'); S.autoT = later(nextQuestion, 1500); }
  S.players.forEach(p=>{ p.dist = 0; p.done = false; p.order = 0; p.cb.classList.remove('go','boost','cough'); setCar(p,0); });
  S.finN = 0; hideOverlays();
  updateBoard(); sfx.reset();
};
$('bReset').onclick = ()=>{ ac(); sfx.reset(); mulaiBabak(); };   // Reset Permainan: skor, soal & posisi dari awal
$('bSound').onclick = ()=>{
  muted = !muted; $('bSound').textContent = muted ? '🔇' : '🔊';
  $('bSound').classList.toggle('off', muted);
  if(!muted) sfx.pilih();
};
function keMenu(){
  clearLater(); stopTimer(); hideOverlays(); S.phase='menu'; S.autoT=0;
  showScreen('intro');
}
$('bHome').onclick = keMenu;
$('bMenu').onclick = keMenu;
$('bAgain').onclick = ()=>{ ac(); sfx.reset(); mulaiBabak(); };     // Main Lagi: tanpa memuat ulang halaman

/* layar penuh */
$('bFull').onclick = ()=>{
  const d = document, e = d.documentElement;
  try{
    if(d.fullscreenElement || d.webkitFullscreenElement){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
    else { (e.requestFullscreen || e.webkitRequestFullscreen).call(e); }
  }catch(err){}
};

/* buka kunci audio pada sentuhan pertama */
addEventListener('pointerdown', ()=>ac(), {once:true});
</script>
